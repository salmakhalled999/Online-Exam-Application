<div class="flex min-h-screen w-full bg-[#F9FAFB]">
    <!-- sidebar (left-side) -->
    <aside class="shrink-0">
        <app-sidebar></app-sidebar>
    </aside>

    <!-- (right-side) -->
    <section class="flex-1 min-w-0">

        <!-- breadCrumb part -->
        <div>
            <div class="w-full h-12.5 pt-4 ps-4 pb-4 bg-red-500">
                <p>Diplomas / Frontend Development / CSS Exam</p>
                <!-- <p-breadcrumb></p-breadcrumb> -->
            </div>
        </div>

        <!-- header part -->
        <div>
            <div class="w-full pt-6 ps-6 flex gap-2.5">
                <div class="flex items-center w-9.5 h-19.25 gap-2.5 opacity-100 border border-[#155DFC] bg-[#FFFFFF]">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 18L9 12L15 6" stroke="#155DFC" stroke-width="1.25" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>

                </div>
                <div class="flex w-full items-center gap-4 p-4 bg-[#155DFC]">
                    <svg width="45" height="45" viewBox="0 0 45 45" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M17.0438 16.875C17.4846 15.6219 18.3547 14.5652 19.4999 13.8921C20.6452 13.219 21.9917 12.973 23.301 13.1976C24.6102 13.4222 25.7978 14.1029 26.6533 15.1191C27.5088 16.1354 27.977 17.4216 27.975 18.75C27.975 22.5 22.35 24.375 22.35 24.375M22.5 31.875H22.5188M41.25 22.5C41.25 32.8553 32.8553 41.25 22.5 41.25C12.1447 41.25 3.75 32.8553 3.75 22.5C3.75 12.1447 12.1447 3.75 22.5 3.75C32.8553 3.75 41.25 12.1447 41.25 22.5Z"
                            stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <span class="font-semibold text-[32px] leading-[100%] text-white">
                        CSS Exam Questions
                    </span>
                </div>
            </div>
        </div>

        <!-- question card -->
        <div class="w-[257.5] h-129 overflow-hidden ps-6 pt-6">
            <div class="w-full h-full p-6 bg-[#FFFFFF]">
                <!-- digram -->
                <div class="flex justify-between items-center pb-4">
                    <div class="w-full">
                        <div class="flex justify-between">
                            <span
                                class="font-normal text-[16px] leading-none tracking-normal align-middle text-[#1F2937]">Frontend
                                Development - CSS Quiz</span>
                            <span
                                class="text-[#6B7280] font-normal text-[14px] leading-none tracking-normal align-middle">Question
                                <span
                                    class="text-[#155DFC] font-bold text-[14px] leading-none tracking-normal align-middle">1</span>
                                of 25</span>
                        </div>
                        <div>
                            <div class="max-w-full rounded-none pt-1.5 ">
                                <p-progressbar [style]="{'--p-progressbar-value-background': '#155DFC'}"
                                    [showValue]="false" [value]="50" />
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center">
                        <div class="bg-[#E5E7EB] w-16.25 border-t border-gray-300 -rotate-90">

                        </div>

                        <div>
                            <div class="relative w-16.25 h-16.25">

                                <svg class="absolute inset-0" width="65" height="65" viewBox="0 0 65 65">
                                    <!-- Full range circle -->
                                    <circle cx="32.5" cy="32.5" r="27.5" fill="none" stroke="#DBEAFE"
                                        stroke-width="10" />

                                    <!-- Progress -->
                                    <circle cx="32.5" cy="32.5" r="27.5" fill="none" stroke="#155DFC" stroke-width="10"
                                        [attr.stroke-dasharray]="circumference"
                                        [attr.stroke-dashoffset]="progressOffset" transform="rotate(-90 32.5 32.5)" />
                                </svg>

                                <!-- Text -->
                                <span class="absolute inset-0 flex items-center justify-center
                            font-[Geist_Mono] text-[14px] text-[#64748B]">
                                    05:13
                                </span>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- question -->
                <div class="pt-7">
                    <div>
                        <span
                            class="text-[#155DFC]  font-semibold text-2xl leading-none tracking-normal align-middle">What
                            does CSS stand for?</span>
                    </div>

                    <div class="card flex pt-4">
                        <div class="flex flex-col gap-4 ">
                            @for (category of categories; track category.key) {
                            <div class="field-checkbox w-245.5 h-12.5 p-4 flex gap-2.5 bg-[#F9FAFB] pt-2.5">

                                <p-radiobutton [inputId]="category.key" name="category" [value]="category"
                                    [(ngModel)]="selectedCategory" />

                                <label [for]="category.key" class="ml-2"> {{category.name}} </label>

                            </div>
                            }
                        </div>
                    </div>
                </div>

                <!-- buttons -->
                <div class="flex gap-4 pt-4">
                    <div class="flex justify-center items-center bg-[#E5E7EB] w-120.75 h-11.5 gap-2.5 ">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11.25 13.5L6.75 9L11.25 4.5" stroke="#9CA3AF" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <button
                            class="text-[#9CA3AF]  font-medium text-[14px] leading-none tracking-normal align-middle">Previous</button>
                    </div>

                    <div class="justify-center items-center bg-[#155DFC] w-120.75 h-11.5 flex gap-2.5">
                        <button
                            class="text-[#FFFFFF] font-medium text-[14px] leading-none tracking-normal align-middle">Next</button>
                            
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6.75 13.5L11.25 9L6.75 4.5" stroke="white" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
