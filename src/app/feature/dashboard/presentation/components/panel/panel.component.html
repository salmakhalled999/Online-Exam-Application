<div class="pb-4">
    <div class="w-225 h-34 p-4 flex gap-4 bg-[#EFF6FF] border border-dashed border-[#8EC5FF]">

        <div class="w-25 h-25 p-3.25 bg-[#DBEAFE] border border-[#8EC5FF]">
            <img class="w-100" [src]="data().image" alt="">
        </div>

        <div class="flex-1 min-w-0">
            <div class="flex w-full m justify-between">

                <span class="font-semibold text-[20px] leading-[100%] text-[#155DFC]"> {{data().title}} </span>

                <div class="flex items-center gap-4">
                    <div class="flex items-center  gap-1">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#clip0_41826_308)">
                                <path
                                    d="M6.8175 6.75C6.99383 6.24875 7.34186 5.82608 7.79997 5.55685C8.25807 5.28762 8.79667 5.1892 9.32038 5.27903C9.84409 5.36886 10.3191 5.64114 10.6613 6.04765C11.0035 6.45415 11.1908 6.96864 11.19 7.5C11.19 9 8.94 9.75 8.94 9.75M9 12.75H9.0075M16.5 9C16.5 13.1421 13.1421 16.5 9 16.5C4.85786 16.5 1.5 13.1421 1.5 9C1.5 4.85786 4.85786 1.5 9 1.5C13.1421 1.5 16.5 4.85786 16.5 9Z"
                                    stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </g>
                            <defs>
                                <clipPath id="clip0_41826_308">
                                    <rect width="18" height="18" fill="white" />
                                </clipPath>
                            </defs>
                        </svg>

                        <span class="font-normal text-[14px] leading-[100%] tracking-normal text-[#1F2937]">
                            {{data().questionsCount}}
                            Questions</span>
                    </div>
                    <div class="w-4.5 h-px bg-[#1F2937] -rotate-90"></div>
                    <div class="flex items-center  gap-1">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M7.5 1.5H10.5M9 10.5L11.25 8.25M15 10.5C15 13.8137 12.3137 16.5 9 16.5C5.68629 16.5 3 13.8137 3 10.5C3 7.18629 5.68629 4.5 9 4.5C12.3137 4.5 15 7.18629 15 10.5Z"
                                stroke="#1F2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <span class="font-normal text-[14px] leading-[100%] tracking-normal text-[#1F2937]">
                            {{data().questionsCount}}
                            minutes</span>
                    </div>
                </div>
            </div>
            <div class="pt-1">
                <p
                    class="font-normal text-[14px] leading-[100%] tracking-normal align-middle line-clamp-4 text-[#6B7280]">
                    {{data().description}}
                </p>
                <div class="flex justify-between">
                    <span
                        class="font-semibold text-[14px] leading-[100%] tracking-normal align-middle text-[#1F2937] cursor-pointer"
                        (click)="toggleDetails()"> {{showDetails ? 'See Less' : 'See More'}}
                    </span>

                    @if (showDetails) {
                    <button [routerLink]="['/questions',data().id]" type="button" class="mt-5 flex cursor-pointer justify-center items-center gap-2 px-6 py-2 bg-[#155DFC] text-white text-[14px] font-normal">
                        Start Now
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13.5 12L16.5 9L13.5 6M16.5 9H1.5" stroke="white" stroke-width="1.25"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
