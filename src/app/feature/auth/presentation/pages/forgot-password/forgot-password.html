<div class="row flex flex-wrap gap-26">
    <div class="co1-12 col-lg-6 w-full lg:w-180">
        <app-static-panel></app-static-panel>
    </div>

    <div class="co1-12 col-lg-6  w-full p-6 max-w-113 h-auto flex justify-center items-center">
        <form [formGroup]="ForgotPasswordForm" class="w-full max-w-113 h-auto" action="">
            <div>
                <h2 class="font-inter font-bold text-[30px] text-[#1F2937]">Forgot Password</h2>
            </div>

            <div class="pt-3">
                <p class="text-[#6B7280]">Don’t worry, we will help you recover your <br> account.</p>
            </div>

            <div class="flex flex-col gap-1 pt-6">
                <label for="email" class="font-medium text-[#1F2937]">Email</label>
                <input formControlName="email" pInputText id="email" type="text" placeholder="user@example.com" />
            </div>

            <div class="pt-10">
                <button (submit)="ForgotPassword()" pButton type="button" routerLink="/verify-otp"
                    class="w-full text-[#1F2937]! font-medium text-sm bg-[#155DFC]! border-[#155DFC]! py-3">
                    Next
                    <i class="pi pi-chevron-right"></i>
                </button>
            </div>

            <div class="pt-4 text-center">
                <a routerLink="" class="cursor-pointer font-medium text-sm  text-[#6B7280]!">
                    Don’t have an account? <span class="text-[#155DFC]">Create yours</span>
                </a>
            </div>

        </form>

    </div>
</div>
