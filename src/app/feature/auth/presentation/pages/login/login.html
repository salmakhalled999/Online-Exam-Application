<div class="row flex flex-wrap gap-26">

    <div class="col-12 col-lg-6 w-full lg:w-180">
        <app-static-panel></app-static-panel>
    </div>
    <div class="col-12 col-lg-6 w-full p-6 max-w-113 h-auto flex justify-center items-center">
        <form class="w-full max-w-113 h-auto " action="">
            <div>
                <h2 class="font-bold text-[30px] text-[#1F2937]">Login</h2>
            </div>

            <div class="flex flex-col gap-1 pt-10">
                <label for="username" class="font-medium text-[#1F2937]">Username</label>
                <input pInputText  id="username" type="text" placeholder="user123" />
            </div>

            <div class="flex flex-col gap-1 pt-4">
                <label for="password" class="font-medium  text-[#1F2937]">Password</label>

                <p-password inputId="password" placeholder="********" [feedback]="false" [toggleMask]="true" fluid>
                </p-password>
            </div>

            <div class="pt-2 flex justify-end">
                 <a routerLink="/forgot-password"  class="font-medium cursor-pointer text-sm text-[#155DFC]">Forgot your password?</a>
            </div>

            <div class="pt-10">
                <button routerLink="/login-error" pButton type="" class="w-full text-white font-medium text-sm bg-[#155DFC]! border-[#155DFC]! rounded-xl py-3">
                    Login
                </button>
            </div>

            <div class="pt-4 text-center">
                <a routerLink="/email" class="cursor-pointer font-medium text-sm  text-[#6B7280]!">
                    Don’t have an account? <span class="text-[#155DFC]">Create yours</span>
                </a>
            </div>

        </form>
    </div>
</div>
