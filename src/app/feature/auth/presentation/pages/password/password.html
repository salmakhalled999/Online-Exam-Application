<div class="row flex flex-wrap gap-26">
    <div class="co1-12 col-lg-6 w-full lg:w-180">
        <app-static-panel></app-static-panel>
    </div>

    <div class="co1-12 col-lg-6  w-full p-6 max-w-113 h-auto flex justify-center items-center">
        <form class="w-full max-w-113 h-auto" action="">
            <div>
                <!-- steps shape -->
                <h2 class="font-bold text-[30px] text-[#1F2937]">Create Account</h2>
            </div>

            <div>
                <span class="font-bold text-2xl text-[#155DFC]">Create a strong password</span>
            </div>

            <div class="pt-6">
                <label for="password" class="font-medium text-[#1F2937]">Password<span
                        class="font-medium text-[#DC2626]">*</span></label>
                <p-password inputId="password" placeholder="********" [feedback]="false" [toggleMask]="true" fluid>
                </p-password>
            </div>

            <div class="pt-3">
                <label for="confirmPassword" class="font-medium text-[#1F2937]">Confirm Password<span
                        class="font-medium text-[#DC2626]">*</span></label>
                <p-password inputId="confirmPassword" placeholder="********" [feedback]="false" [toggleMask]="true"
                    fluid>
                </p-password>
            </div>

            <div class="pt-10">
                <button pButton type="" routerLink="/login"
                    class="w-full text-white font-medium text-sm bg-[#155DFC]! border-[#155DFC]! rounded-xl py-3">
                    Create Account
                </button>
            </div>

        </form>

    </div>
</div>
